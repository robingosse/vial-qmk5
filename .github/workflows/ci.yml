name: CI

on: [pull_request, push, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-dacman:
    name: Build DacMan RP2040 Vial
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:2dc05fc9f32efebd6b05c2b8676ee548358bc7e151e9dbf4dac6b6eed4513b07

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Compile DacMan firmware
        run: |
          git config --global --add safe.directory $(pwd)

          echo "Building DacMan RP2040 Vial firmware..."

          qmk compile -kb handwired/onekey/rp2040 -km vial

          echo "UF2 files found:"
          find . -name "*.uf2" -print

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Purple-Dac-Man-firmware
          path: |
            **/*.uf2
